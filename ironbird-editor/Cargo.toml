[package]
name = "ironbird-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", features = ["dynamic_linking"] }
bevy_egui = "0.40.0"
egui_tiles = { version = "0.15.0", features = ["serde"] }
serde = { version  = "1.0.228", features = [ "derive" ]}

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C",
    "link-arg=-fuse-ld=lld",
    "-Zshare-generics=y",
]
